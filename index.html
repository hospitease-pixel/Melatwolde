<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melat Wolde | Melat's Gift Shop</title>
    
    <meta property="og:title" content="Melat Wolde - Digital Business Card" />
    <meta property="og:description" content="Digital Business Card for Melat Wolde, Actress and Business Woman at Melat's Gift Shop." />
    <meta property="og:image" content="https://i.ibb.co/sGZVzgq/IMG-9715.jpg" /> 
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #010203;
        }
        .contact-btn {
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            border: 1px solid #FFFF00;
        }
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.4); 
        }

        .wave-background {
            background: linear-gradient(to bottom, #0a0a0a 0%, #010203 100%); 
            position: relative; 
            overflow: hidden; 
            z-index: 1; 
            border-bottom: 4px solid #FFFF00; 
        }

        .graph-pattern-background {
            background-color: #010203; 
        }

        .strip-decoration {
            position: absolute;
            width: 450px; 
            height: 10px; 
            background-color: #1f2937;
            transform: rotate(-45deg); 
            opacity: 0.5;
        }
        .strip-ur-1 { top: -100px; right: -150px; } 
        .strip-ll-1 { bottom: -100px; left: -150px; } 

        .icon-facebook { background-color: #1877F2; color: white; }
        .icon-youtube { background-color: #FF0000; color: white; }
        .icon-tiktok { background-color: #000000; color: white; }
        .icon-whatsapp { background-color: #25D366; color: white; }
        .icon-instagram { 
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #405ded 90%);
            color: white; 
        } 

        @keyframes slow-pulse {
            0% { transform: scale(1); opacity: 0.15; } /* Increased base opacity */
            50% { transform: scale(1.1); opacity: 0.25; } /* Increased peak opacity */
            100% { transform: scale(1); opacity: 0.15; }
        }
        .animate-watermark {
            animation: slow-pulse 8s ease-in-out infinite;
        }

        #businessLogo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transform: scale(1.1); 
        }

        .profile-container {
            z-index: 20;
            position: relative;
        }
    </style>
</head>
<body class="min-h-screen p-4 py-8">

    <div id="messageBox" class="fixed top-4 left-1/2 -translate-x-1/2 p-3 rounded-lg text-sm text-center hidden z-50 transition-all duration-300 shadow-xl">
        Action completed.
    </div>

    <div id="id-card-content" 
        class="graph-pattern-background max-w-sm w-full mx-auto p-4 md:p-6 rounded-3xl 
               border border-gray-800 
               shadow-[0_20px_50px_rgba(0,0,0,0.8)] 
               relative overflow-hidden">
        
        <div class="wave-background absolute top-0 left-0 right-0 h-80 -mt-1 -mx-1 rounded-t-[1.5rem] flex justify-center items-center">
            <div class="p-2 flex justify-center items-center z-10 w-full h-full"> 
                <img id="businessLogo" 
                    src="https://i.ibb.co/4R5wZ5yh/and-many-more.png" 
                    alt="And Many More Logo" 
                    onerror="this.onerror=null; this.src='https://placehold.co/400x400/010203/FFFF00?text=LOGO';"
                >
            </div>
        </div>

        <!-- Watermark with increased visibility -->
        <div class="absolute inset-0 z-0 pointer-events-none flex justify-center items-center">
            <div class="absolute animate-watermark w-full h-full flex justify-center items-center opacity-20"> <!-- Increased static opacity -->
                <img src="https://i.ibb.co/xq22D7WB/and-many-more-5.png" alt="Watermark" class="w-4/5 h-4/5 object-contain">
            </div>
        </div>

        <div class="strip-decoration strip-ur-1"></div>
        <div class="strip-decoration strip-ll-1"></div>

        <div class="relative z-10"> 
            <div class="text-center mb-6 pt-64"> 
                <div class="relative w-40 h-40 mx-auto rounded-full border-4 border-gray-900 shadow-2xl overflow-hidden profile-container">
                    <img 
                        id="profilePicture" 
                        src="https://i.ibb.co/sGZVzgq/IMG-9715.jpg" 
                        alt="Melat Wolde" 
                        class="w-full h-full rounded-full object-cover"
                    >
                </div>
                
                <h1 id="contactName" class="text-2xl font-extrabold text-white mt-4">Melat Wolde</h1> 
                <p id="contactOrg" class="text-xl font-semibold text-[#FFFF00] mt-1">Melat's Gift Shop</p>
                <p id="contactTitle" class="text-sm font-medium text-gray-400 uppercase tracking-widest mt-2">Actress & Business Woman</p> 
            </div>

            <div class="space-y-3 mt-8">
                <!-- Primary Call Button -->
                <a href="tel:0962185060" class="contact-btn flex items-center justify-center p-3 bg-black text-[#FFFF00] font-bold rounded-xl">
                    <i data-lucide="phone" class="w-5 h-5 mr-3"></i>
                    Call: 0962185060
                </a>

                <!-- WhatsApp Button -->
                <a href="https://wa.me/251962185060" target="_blank" class="contact-btn flex items-center justify-center p-3 bg-black text-white font-bold rounded-xl border-green-500">
                    <i class="fa-brands fa-whatsapp text-xl mr-3 text-[#25D366]"></i>
                    WhatsApp Melat
                </a>
                
                <!-- SMS Button -->
                <a href="sms:0962185060" class="contact-btn flex items-center justify-center p-3 bg-black text-white font-bold rounded-xl border-gray-700">
                    <i data-lucide="message-square" class="w-5 h-5 mr-3"></i>
                    Send SMS
                </a>
            </div>
            
            <div class="mt-8 border-t border-gray-800 pt-6">
                <div class="flex justify-center gap-5"> 
                    <a href="https://www.tiktok.com/@melat_wolde" target="_blank" class="w-10 h-10 flex items-center justify-center rounded-full transition-transform hover:scale-110 icon-tiktok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://www.instagram.com/melat__wolde" target="_blank" class="w-10 h-10 flex items-center justify-center rounded-full transition-transform hover:scale-110 icon-instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://www.youtube.com/@melatwolde_7407" target="_blank" class="w-10 h-10 flex items-center justify-center rounded-full transition-transform hover:scale-110 icon-youtube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                    <a href="https://www.facebook.com/melat.wolde.149486" target="_blank" class="w-10 h-10 flex items-center justify-center rounded-full transition-transform hover:scale-110 icon-facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                </div>
            </div>

            <div class="mt-10 space-y-3">
                <button 
                    id="downloadButton"
                    class="w-full flex items-center justify-center p-3 bg-[#FFFF00] text-black font-black rounded-xl shadow-lg hover:opacity-90 transition-opacity"
                >
                    <i data-lucide="download" class="w-5 h-5 mr-2"></i>
                    SAVE CARD AS IMAGE
                </button>

                <button 
                    id="vcfButton"
                    class="w-full flex items-center justify-center p-3 bg-transparent text-gray-300 font-bold rounded-xl border border-gray-700 hover:bg-gray-900 transition-colors"
                >
                    <i data-lucide="user-plus" class="w-5 h-5 mr-2"></i>
                    ADD TO CONTACTS
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const messageBox = document.getElementById('messageBox');
        
        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden');
            messageBox.classList.add('bg-gray-800', 'text-[#FFFF00]', 'border', 'border-[#FFFF00]'); 
            setTimeout(() => { messageBox.classList.add('hidden'); }, 3000);
        }

        document.getElementById('downloadButton').addEventListener('click', () => {
            const card = document.getElementById('id-card-content');
            showMessage('Saving image...'); 
            html2canvas(card, {
                scale: 3,
                useCORS: true,
                backgroundColor: '#010203',
                borderRadius: 24
            }).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'Melat_Wolde_BusinessCard.png';
                link.click();
            });
        });

        document.getElementById('vcfButton').addEventListener('click', () => {
            let vcf = "BEGIN:VCARD\nVERSION:3.0\nFN:Melat Wolde\nORG:Melat's Gift Shop\nTITLE:Actress & Business Woman\nTEL:0962185060\nEND:VCARD";
            const blob = new Blob([vcf], { type: 'text/vcard' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Melat_Wolde.vcf`;
            link.click();
            showMessage('VCF Created!');
        });
    </script>
</body>
</html>
